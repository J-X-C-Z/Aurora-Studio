name: Bug 报告
description: 报告可复现的缺陷
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        不要上传个人照片、客户文件、相机序列号、GPS、Capture One
        catalog/session、测试私有资产或包含本机路径的完整日志。

  - type: textarea
    id: summary
    attributes:
      label: 现象
      description: 发生了什么，期望是什么？
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开...
        2. 调整...
        3. 观察到...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 提交或版本
      placeholder: commit SHA / release version
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: Windows 版本、CPU/GPU、安装/构建方式、缩放与颜色设置。
    validations:
      required: true

  - type: dropdown
    id: preview
    attributes:
      label: 是否涉及预览
      options:
        - 否
        - 拖动预览
        - 静止预览
        - 两者行为不同

  - type: textarea
    id: evidence
    attributes:
      label: 可公开的证据
      description: 使用 synthetic、已脱敏图片或文字描述。

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除个人照片、私有资产、序列号、GPS 和本机绝对路径
          required: true
