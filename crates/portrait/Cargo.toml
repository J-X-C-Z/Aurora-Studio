[package]
name = "aurora-portrait"
version.workspace = true
edition.workspace = true
license.workspace = true
exclude = ["work/**", "testdata/**", "examples/**", "scripts/**"]

[features]
default = ["wgpu-backend"]
# Gates src/wgpu_compute.rs (ComputeBackend over wgpu). The legacy
# src/wgpu_backend.rs free-function API is always compiled.
wgpu-backend = []

[dependencies]
# Cross-platform WGPU/Vulkan compute backend (src/wgpu_backend.rs).
# Versions match Cargo.lock so offline workspace builds resolve without network.
wgpu = "30.0.1"
pollster = "0.4.0"

# The DX12 compute backend (src/dx12.rs) binds D3D12/DXGI/D3DCompiler directly;
# the pinned version is the one already in Cargo.lock for other workspace crates,
# and no redistributable binary is added: d3d12.dll/dxgi.dll/d3dcompiler_47.dll
# ship with Windows 10/11.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Threading",
] }

[dev-dependencies]
serde_json.workspace = true

