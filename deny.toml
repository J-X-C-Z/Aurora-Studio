# cargo-deny configuration for Aurora Studio (IN-2).
#
# D-1 (license policy) is still open. This file only enforces a permissive
# baseline and denies unlicensed crates; it is NOT a final license decision.
# Open questions are tracked in ASSET-LICENSES.md.
#
# MPL-2.0 is included because dwrote/option-ext/cbindgen are in the Windows
# dependency graph. It is weak copyleft, so D-1 must confirm it explicitly.
# NCSA/Unicode-3.0/MIT-0/BSL-1.0 appear only inside AND/OR expressions that
# cannot be satisfied without them.

[graph]
targets = ["x86_64-pc-windows-msvc"]

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = []

[licenses]
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
exceptions = []

[bans]
# 92 duplicate crate families exist today; track them without blocking PRs.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/ELY-Open-Source/Ely-GPUI-Components"]
